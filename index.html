<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاركة الموقع المباشر</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #f4f4f9; }
        button { padding: 15px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
        p { margin-top: 20px; color: #333; font-size: 16px; }
    </style>
</head>
<body>
    <h2>مشاركة الموقع المباشر</h2>
    <p>اضغط على الزر بالأسفل للموافقة على مشاركة موقعك</p>
    <button onclick="startSharing()">موافقة ومشاركة الموقع</button>
    <p id="status"></p>

    <script>
        const dbUrl = "https://" + "my-location-32dcf-default-rtdb" + "." + "firebaseio" + "." + "com/location.json";

        function startSharing() {
            const status = document.getElementById('status');
            if (!navigator.geolocation) {
                status.textContent = 'متصفحك لا يدعم تحديد الموقع.';
                return;
            }
            status.textContent = 'جاري طلب الإذن... يرجى الضغط على "سماح"';
            navigator.geolocation.watchPosition(
                (position) => {
                    const data = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        time: new Date().toLocaleTimeString()
                    };
                    fetch(dbUrl, {
                        method: 'PUT',
                        body: JSON.stringify(data)
                    }).then(() => {
                        status.textContent = 'تم تفعيل مشاركة الموقع بنجاح! لا تغلق هذه الصفحة.';
                    });
                },
                () => {
                    status.textContent = 'تم رفض الإذن أو تعذر تحديد الموقع.';
                },
                { enableHighAccuracy: true }
            );
        }
    </script>
</body>
</html>
